# Scheduled Solid Queue jobs. Nothing on the realtime conversation path runs here.
finalize_stale_sessions: &finalize_stale_sessions
  class: FinalizeStaleSessionsJob
  schedule: every minute

development:
  finalize_stale_sessions: *finalize_stale_sessions

production:
  finalize_stale_sessions: *finalize_stale_sessions
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
