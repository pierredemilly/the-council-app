# Fly.io configuration. Two process groups built from the same Dockerfile:
# `app` serves HTTP + WebSockets behind Thruster, `worker` runs Solid Queue.
app = "the-council"
primary_region = "cdg"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]

[deploy]
  release_command = "./bin/rails db:prepare"

[env]
  PORT = "8080"
  RAILS_MAX_THREADS = "5"
  DB_POOL = "8"
  RAILS_LOG_TO_STDOUT = "true"

[processes]
  app = "./bin/thrust ./bin/rails server"
  worker = "./bin/jobs"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/up"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["app", "worker"]
